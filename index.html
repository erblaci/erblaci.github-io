    <script>
            var count=9999;
            var reply=""
       async function Next(){

            answer = document.getElementById("answer").value;
            
           // request.open('get','https://discord.com/api/v9/invites/sFxtDpKBbq?with_counts=true&with_expiration=true',true)
         await fetch('https://discord.com/api/v9/invites/sFxtDpKBbq?with_counts=true&with_expiration=true').then((res)=>
            {
              return res.json();
                
                
            }).then(data=>{
                count = data["approximate_member_count"];
            })
           
            if(answer==count){
               reply="here is the clue: bummer";
            }
            else if(answer>count)
            {
                reply="less";
            }else if(answer<count)
            {
                reply="more";
            }

             document.getElementById("clue").innerHTML=reply;
            
        }
